appId: cn.touchdeck.app
productName: TouchDeck
directories:
  output: dist
files:
  - out/**/*
  - touchdeck.config.json
  - layouts/**/*
  - themes/**/*
  - icons/**/*
  - src/assets/**/*
  - package.json
  - node_modules/**/*
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: touchdeck-setup-${version}.exe
portable:
  artifactName: touchdeck-portable-${version}.exe
