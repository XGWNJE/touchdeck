name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Rename APK with version
        working-directory: android/app/build/outputs/apk/debug
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' ../../../../build.gradle.kts 2>/dev/null || echo dev)"
          cp app-debug.apk "touchdeck-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/touchdeck-*.apk
          if-no-files-found: error

  electron-package:
    name: Package Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Build installers
        run: npm run dist:win

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error

  signal-package:
    name: Package signal server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server deps
        working-directory: server
        run: npm ci --omit=dev

      - name: Create tarball
        working-directory: server
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          tar -czf "../touchdeck-signal-${VERSION}.tar.gz" --exclude='./package-lock.json' --exclude='./node_modules/.cache' ./

      - name: Upload signal tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-server
          path: touchdeck-signal-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-build, electron-package, signal-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - name: Create/update release
        env:
          GH_TOKEN: ${{ github.token }}
          # publish job 不 checkout 仓库，gh 需要 GH_REPO 定位目标仓库（2026-08-06 v0.1.7 实证：
          # 缺了报 fatal: not a git repository）
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=""
          while IFS= read -r f; do ASSETS="${ASSETS} ${f}"; done < <(find dist-assets -type f)
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" ${ASSETS} --title "TouchDeck ${TAG}" --notes "三端发行物：安卓 APK + Windows 安装包（setup + portable）+ 信令服务包。"
          else
            gh release upload "${TAG}" ${ASSETS} --clobber
          fi

