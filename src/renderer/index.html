<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 视觉令牌全部由主题注入（--t-*），此处只保留结构骨架与默认值兜底 */
  :root {
    --t-bar-bg: rgba(24,24,28,.92);
    --t-bar-radius: 20px;
    --t-bar-border: rgba(255,255,255,.08);
    --t-btn-bg: #2e2e36;
    --t-btn-fg: #eeeeee;
    --t-btn-sub: #999999;
    --t-btn-radius: 16px;
    --t-btn-border: rgba(255,255,255,.10);
    --t-icon-size: 32px;
    --t-label-size: 19px;
    --t-sub-size: 12px;
    --t-pressed-bg: #f8fafc;
    --t-pressed-fg: #111111;
    --t-pressed-sub: #555555;
    --t-armed-bg: #713f12;
    --t-armed-fg: #fde047;
    --t-armed-border: #facc15;
    --t-armed-glow: rgba(250,204,21,.67);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }

  #bar {
    display: flex; flex-direction: column; width: 100%; height: 100%;
    background: var(--t-bar-bg);
    border-radius: var(--t-bar-radius);
    border: 1px solid var(--t-bar-border);
    transition: opacity .5s ease;
    cursor: grab;
    -webkit-app-region: drag; /* 空白处与小揪揪走原生拖拽（当前环境唯一验证可靠的通道） */
  }
  #grid { display: grid; flex: 1; min-height: 0; }
  /* 小揪揪拖拽手柄：整条都是原生拖拽区，居中一粒胶囊作视觉提示 */
  #handle { flex: none; display: flex; align-items: center; justify-content: center; cursor: grab; }
  #handle::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--t-btn-border); }
  .btn { -webkit-app-region: no-drag; }
  /* 长按抓起拖拽中：整栏虚线描边提示 */
  #bar.dragging { outline: 2px dashed var(--t-pressed-bg); outline-offset: 3px; }
  #bar.dim { opacity: var(--dim-op, .6); }

  .btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--t-btn-radius); cursor: pointer;
    background: var(--t-btn-bg); color: var(--t-btn-fg);
    border: 1px solid var(--t-btn-border);
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
    transition: transform .08s, background .08s;
  }
  .btn .icon { font-size: var(--t-icon-size); line-height: 1.2; width: var(--t-icon-size); height: var(--t-icon-size);
    display: flex; align-items: center; justify-content: center; }
  .btn .icon svg { width: 100%; height: 100%; }
  .btn .icon img { width: 100%; height: 100%; object-fit: contain; }
  .btn .icon svg * { vector-effect: non-scaling-stroke; }
  /* 隐藏文字模式：图标放大 1.5 倍，独占按钮视觉 */
  #bar.no-label .btn .icon { width: calc(var(--t-icon-size) * 1.5); height: calc(var(--t-icon-size) * 1.5); }
  .btn .label { font-size: var(--t-label-size); font-weight: 600; margin-top: 4px; }
  .btn .sub { font-size: var(--t-sub-size); color: var(--t-btn-sub); margin-top: 2px; }

  /* 分组颜色由 JS 按主题 groups 动态生成（.btn.grp-<name>） */

  /* 反馈：变色 + 下沉，停留 450ms（链路延迟下也看得见） */
  .btn.pressed { background: var(--t-pressed-bg); color: var(--t-pressed-fg); transform: translateY(3px) scale(.96); box-shadow: none; }
  .btn.pressed .sub { color: var(--t-pressed-sub); }
  /* 二次确认武装态 */
  .btn.armed { border-color: var(--t-armed-border); box-shadow: 0 0 18px var(--t-armed-glow); background: var(--t-armed-bg); color: var(--t-armed-fg); }
  .btn.armed .sub { color: var(--t-armed-fg); }
  /* 未配置按键的按钮：抖动提示 */
  .btn.unconfigured { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head>
<body>
<div id="bar"></div>
<script>
  const bar = document.getElementById("bar");

  /* 把主题 JSON 注入为 CSS 令牌与分组样式 */
  function applyTheme(theme) {
    const root = document.documentElement.style;
    const set = (k, v) => { if (v !== undefined && v !== null) root.setProperty(k, typeof v === "number" ? v + "px" : v); };

    if (theme.bar) {
      const rgb = theme.bar.backgroundRgb || "24, 24, 28";
      const op = theme.bar.opacity !== undefined ? theme.bar.opacity : 0.92;
      set("--t-bar-bg", `rgba(${rgb}, ${op})`);
      set("--t-bar-radius", theme.bar.borderRadius);
      set("--t-bar-border", theme.bar.borderColor);
      bar.style.setProperty("--dim-op", theme.bar.idleDimOpacity !== undefined ? theme.bar.idleDimOpacity : 0.6);
    }
    if (theme.button) {
      set("--t-btn-bg", theme.button.background);
      set("--t-btn-fg", theme.button.color);
      set("--t-btn-sub", theme.button.subColor);
      set("--t-btn-radius", theme.button.borderRadius);
      set("--t-btn-border", theme.button.borderColor);
      set("--t-icon-size", theme.button.iconSize);
      set("--t-label-size", theme.button.labelSize);
      set("--t-sub-size", theme.button.subSize);
    }
    if (theme.pressed) {
      set("--t-pressed-bg", theme.pressed.background);
      set("--t-pressed-fg", theme.pressed.color);
      set("--t-pressed-sub", theme.pressed.subColor);
    }
    if (theme.armed) {
      set("--t-armed-bg", theme.armed.background);
      set("--t-armed-fg", theme.armed.color);
      set("--t-armed-border", theme.armed.borderColor);
      set("--t-armed-glow", theme.armed.glowColor);
    }
    // 分组样式动态生成：主题里加一组色板即可新增分组，无需改代码
    const old = document.getElementById("grp-styles");
    if (old) old.remove();
    const style = document.createElement("style");
    style.id = "grp-styles";
    const groups = theme.groups || {};
    style.textContent = Object.entries(groups).map(([name, g]) =>
      `.btn.grp-${name} { background: ${g.background}; border-color: ${g.borderColor}; }`
    ).join("\n");
    document.head.appendChild(style);
  }

  /* 闲时变暗 */
  let dimTimer = null;
  let dimCfg = { seconds: 5 };
  function wake() {
    bar.classList.remove("dim");
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => bar.classList.add("dim"), dimCfg.seconds * 1000);
  }
  document.addEventListener("pointerdown", wake);

  /* 渲染引擎：布局决定网格与按钮，主题决定长相 */
  async function render() {
    const config = await window.touchdeck.getConfig();
    const { behavior, theme, layout, buttons } = config;
    dimCfg.seconds = behavior.idleDimSeconds;
    applyTheme(theme);
    if (layout.showLabel === false && layout.showSub === false) bar.classList.add("no-label");

    // 小揪揪手柄 + 按钮网格：手柄整条是原生拖拽区；面板贴边时手柄自动翻去不沾边的一侧
    const handleSize = layout.handle && layout.handle.size ? layout.handle.size : 0;
    const grid = document.createElement("div");
    grid.id = "grid";
    grid.style.gridTemplateColumns = `repeat(${layout.columns}, 1fr)`;
    grid.style.gap = layout.gap + "px";
    grid.style.padding = layout.padding + "px";
    let handle = null;
    let handleSide = layout.handle && layout.handle.position === "bottom" ? "bottom" : "top";
    if (handleSize > 0) {
      handle = document.createElement("div");
      handle.id = "handle";
      handle.style.height = handleSize + "px";
      bar.appendChild(handle);
    }
    bar.appendChild(grid);

    if (handle) {
      window.touchdeck.onBounds(({ x, y, width, height, area }) => {
        const topFlush = y - area.y < 10;
        const bottomFlush = area.y + area.height - (y + height) < 10;
        if (handleSide === "top" && topFlush && !bottomFlush) handleSide = "bottom";
        else if (handleSide === "bottom" && bottomFlush && !topFlush) handleSide = "top";
        else return;
        if (handleSide === "bottom") bar.appendChild(handle);
        else bar.insertBefore(handle, grid);
      });
    }

    for (const b of buttons) {
      const el = document.createElement("div");
      el.className = "btn grp-" + (b.group || "edit");
      const showLabel = layout.showLabel !== false;
      const showSub = layout.showSub !== false;
      el.innerHTML = `<div class="icon"></div>`
        + (showLabel ? `<div class="label">${b.label}</div>` : "")
        + (showSub ? `<div class="sub">${b.sub}</div>` : "");
      // 图标：主题 icons/ 或全局 icons/ 里有素材用素材（SVG 直接内联，PNG 用 img），否则回退 emoji/字符
      const iconEl = el.querySelector(".icon");
      window.touchdeck.getIcon(b.icon).then((res) => {
        if (res && res.kind === "svg") iconEl.innerHTML = res.data;
        else if (res && res.kind === "png") iconEl.innerHTML = `<img src="${res.data}" alt="">`;
        else iconEl.textContent = b.icon;
      });

      /* 点击与拖拽分流：长按（dragHoldMs）抓起面板转拖拽；短按松手算点击。
         UU 触控注入下 pointermove 不可靠（移动阈值方案已废），长按只依赖按下+计时 */
      let pd = null;

      function disarm() {
        el.classList.remove("armed");
        el.dataset.armed = "";
        const sub = el.querySelector(".sub");
        if (sub) sub.textContent = b.sub;
      }

      async function fire() {
        if (b.confirm && el.dataset.armed !== "1") {
          el.dataset.armed = "1";
          el.classList.add("armed");
          const sub = el.querySelector(".sub");
          if (sub) sub.textContent = "再点一次!";
          setTimeout(disarm, behavior.confirmSeconds * 1000);
          return;
        }
        disarm();
        const res = await window.touchdeck.press(b.id);
        if (!res.ok && res.reason === "unconfigured") {
          el.classList.add("unconfigured");
          setTimeout(() => el.classList.remove("unconfigured"), 350);
        }
      }

      function endPress(shouldFire) {
        if (!pd) return;
        clearTimeout(pd.timer);
        const wasGrab = pd.grabbed;
        pd = null;
        bar.classList.remove("dragging");
        if (wasGrab) return; // 抓起后的松手只结束拖拽，不触发按键
        if (shouldFire) {
          setTimeout(() => el.classList.remove("pressed"), 450);
          fire();
        } else {
          el.classList.remove("pressed");
        }
      }

      el.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        wake();
        window.touchdeck.stopDrag(); // 兜底：上次拖拽若未正常收尾，这次按下先结束它
        if (pd) return;
        pd = { grabbed: false };
        el.classList.add("pressed");
        pd.timer = setTimeout(() => {
          pd.grabbed = true;
          el.classList.remove("pressed");
          bar.classList.add("dragging");
          window.touchdeck.startDrag();
          // 松手即结束拖拽（UU 注入下 GetAsyncKeyState 未必看得到松手，双保险）
          document.addEventListener("pointerup", () => {
            console.log("[renderer] grab-end pointerup");
            bar.classList.remove("dragging");
            window.touchdeck.stopDrag();
          }, { once: true });
        }, behavior.dragHoldMs || 500);
      });
      el.addEventListener("pointerup", () => endPress(true));
      el.addEventListener("pointercancel", () => endPress(false));
      grid.appendChild(el);
    }
    wake();
    // 临时诊断：启动 3 秒后截屏（此时已进入闲时变暗前的高亮状态）
    setTimeout(() => window.touchdeck.debugShot(), 3000);
  }
  render();
</script>
</body>
</html>
