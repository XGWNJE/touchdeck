<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #stage {
    position: absolute; left: 0; top: 0;
    transform-origin: var(--px, 0) var(--py, 0);
    opacity: 0; transform: scale(.5) rotate(-18deg);
    transition: transform .32s cubic-bezier(.22, 1.6, .36, 1), opacity .25s;
  }
  #stage.open { opacity: 1; transform: scale(1) rotate(0deg); }
  canvas { display: block; }
  #flash {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(34, 34, 38, .9); color: #fff; font-size: 14px;
    padding: 8px 14px; border-radius: 16px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #flash.show { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
