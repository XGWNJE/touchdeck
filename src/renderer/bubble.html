<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #ball {
    position: absolute; inset: 4px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #cfcfd4);
    box-shadow: 0 2px 8px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15);
    opacity: .6;
    transition: opacity .15s, transform .1s;
  }
  body.pressed #ball { opacity: .85; transform: scale(.94); }
</style>
</head>
<body>
<div id="ball"></div>
<script>
// 悬浮球（Windows 版，2026-08-05 定案：本机只保留键鼠交互，触控滑选归安卓端）。
// 手势：快速点按=展开/收起常驻菜单（悬停与确认在菜单端：hover 待选中，
// 左击或松 Tab 确认）；长按 350ms=拖球挪位。无滑选手势。
const HOLD_MS = 350;      // 长按进拖球
const ball = document.getElementById("ball");
const body = document.body;

let pressed = false;       // 悬停 pointermove 也会触发（Chromium 兼容事件），必须按下后才响应
let holdTimer = null;
let dragging = false;

function clearHold() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }

ball.addEventListener("pointerdown", (e) => {
  pressed = true;
  dragging = false;
  body.classList.add("pressed");
  clearHold();
  holdTimer = setTimeout(() => {
    holdTimer = null;
    dragging = true;
    body.classList.remove("pressed");
    window.touchdeck.startDrag();       // 主进程 SetWindowPos 轮询拖动
  }, HOLD_MS);
  e.preventDefault();
});

ball.addEventListener("pointerup", (e) => {
  if (!pressed) return;                 // 杂散 up（合成 mouseup 等）不得触发收起/展开
  body.classList.remove("pressed");
  pressed = false;
  clearHold();
  if (dragging) {
    window.touchdeck.stopDrag();        // 拖球松手：唯一可信的收尾信号
  } else {
    window.touchdeck.toggleMenu();      // 快速点按：展开/收起常驻菜单
  }
  dragging = false;
});

ball.addEventListener("pointercancel", () => {
  body.classList.remove("pressed");
  pressed = false;
  clearHold();
  dragging = false;
});
</script>
</body>
</html>
