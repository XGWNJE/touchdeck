<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #17171b; color: #e8e8ea; padding: 18px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 19px; margin-bottom: 2px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 14px; }

  /* 顶部状态总览 */
  #overview {
    display: flex; gap: 18px; background: #1e1e24; border: 1px solid #33333a;
    border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
  }
  .ov-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #ccc; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; flex: none; }
  .dot.ok { background: #4ade80; box-shadow: 0 0 7px #4ade80; }

  .card {
    background: #222228; border: 1px solid #33333a; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; margin-bottom: 4px; font-weight: 600; }
  .card .desc { color: #888; font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .label { color: #ccc; flex: 1; font-size: 13px; }
  .mono { font-family: Consolas, monospace; font-size: 12px; color: #9ac8ff; word-break: break-all; }

  button {
    background: #2f6fed; border: none; color: #fff; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #3d7dff; }
  button.secondary { background: #3a3a42; }
  button.secondary:hover { background: #4a4a54; }
  button:disabled { opacity: .4; cursor: default; }
  button.main { padding: 11px 20px; font-size: 14px; font-weight: 600; }

  .seg { display: flex; gap: 8px; margin-bottom: 8px; }
  .seg button { flex: 1; background: #3a3a42; }
  .seg button.active { background: #2f6fed; }
  .seg-row { display: flex; align-items: center; gap: 10px; }
  .seg-row .seg { flex: 1; margin-bottom: 0; }

  .addr { display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    background: #1b1b20; border: 1px solid #33333a; border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; }
  .addr:hover { border-color: #4a4a55; }
  .addr .tag { color: #888; font-size: 12px; width: 64px; flex: none; }
  .addr .mono { flex: 1; }
  .addr .copy-hint { color: #4ade80; font-size: 12px; flex: none; display: none; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(40, 40, 46, .95); color: #fff; font-size: 13px; padding: 8px 14px;
    border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>TouchDeck 控制台</h1>
<div class="sub">本机面板 + P2P 远程连接的统一入口</div>

<div id="overview">
  <div class="ov-item"><div class="dot" id="ovP2P"></div><span id="ovP2PT">P2P 直连…</span></div>
  <div class="ov-item"><div class="dot" id="ovPanel"></div><span id="ovPanelT">面板…</span></div>
</div>

<div class="card">
  <h2>本机面板</h2>
  <div class="desc">悬浮球快捷键面板（键鼠交互：点球或按住 Tab 展开）。远程端（手机、平板）在用时，可关闭本机面板避免重复。</div>
  <div class="row">
    <span class="label" id="panelState">…</span>
    <button id="panelBtn" class="main">…</button>
  </div>
</div>

<div class="card">
  <h2>远程连接（P2P 直连）</h2>
  <div class="desc">手机 App 输入房间码即可直连本机，不经过公网转发。</div>
  <div class="row">
    <div class="dot" id="p2pDot"></div>
    <span class="label" id="p2pState">未开启</span>
    <button id="p2pBtn" class="main">开启连接</button>
  </div>
  <div class="addr" id="addrRoom" title="点击复制房间码" style="display:none">
    <span class="tag">房间码</span>
    <span class="mono" id="roomCode">…</span>
    <span class="copy-hint">已复制</span>
  </div>
  <div class="hint" id="p2pHint" style="color:#888;font-size:12px">开启后手机 App 点「P2P 连接」并输入房间码，即与本机直连。</div>
</div>

<div id="toast"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
  }
  async function copyText(text, hintEl) {
    try {
      await navigator.clipboard.writeText(text);
      if (hintEl) {
        hintEl.style.display = "inline";
        setTimeout(() => (hintEl.style.display = "none"), 1200);
      } else {
        toast("已复制");
      }
    } catch {
      toast("复制失败");
    }
  }

  function renderPanel(s) {
    $("ovPanel").classList.toggle("ok", s.panelRunning);
    $("ovPanelT").textContent = "面板 " + (s.panelRunning ? "运行中" : "已关闭");
    $("panelState").textContent = s.panelRunning ? "运行中" : (s.panelDisabled ? "已关闭" : "未运行");
    $("panelBtn").textContent = s.panelRunning ? "关闭面板" : "开启面板";
    $("panelBtn").disabled = false;
  }

  async function refresh() {
    const s = await window.touchdeck.consoleStatus();
    renderPanel(s);
    // P2P 状态（主进程推送或轮询兜底）
    const ps = await window.touchdeck.peerStatusGet();
    renderP2P(ps);
  }

  // P2P 运行态（按钮显示「关闭连接」）；不在列表里的 phase 都是可开启态
  const P2P_ACTIVE = ["connecting", "signal-ok", "room", "peer-joined", "peer-state", "connected", "peer-error", "reconnecting"];

  function renderP2P(ps) {
    const dot = $("p2pDot");
    const label = $("p2pState");
    const btn = $("p2pBtn");
    const room = $("addrRoom");
    btn.disabled = false;   // 渲染即恢复可点（旧版点击后只禁不恢复，按钮永久灰掉）
    $("roomCode").textContent = ps.code || "…";
    room.style.display = ps.code ? "flex" : "none";
    const ov = $("ovP2P");
    const ovT = $("ovP2PT");
    ov.classList.toggle("ok", ps.phase === "connected");
    const peersN = ps.peers || 0;
    const peersTxt = peersN > 0 ? `（${peersN} 台设备）` : "";
    const stateTxt = { new: "建立中", connecting: "建立中", connected: "已直连", disconnected: "抖动断开，恢复中…", failed: "连接失败", closed: "已关闭" };
    switch (ps.phase) {
      case "connecting":
        dot.classList.remove("ok"); label.textContent = "连接信令中…"; break;
      case "signal-ok":
        dot.classList.remove("ok"); label.textContent = "信令已连接，正在创建房间…"; break;
      case "room":
        dot.classList.remove("ok"); label.textContent = "等待手机加入（30 分钟有效）"; break;
      case "peer-joined":
        dot.classList.remove("ok"); label.textContent = "手机已加入，正在建立直连…"; break;
      case "peer-state":
        // ICE/连接状态变化：按实际状态显示，不再打回「未开启」谎报
        dot.classList.toggle("ok", ps.state === "connected");
        label.textContent = "直连状态：" + (stateTxt[ps.state] || ps.state || "未知") + peersTxt;
        break;
      case "connected":
        dot.classList.add("ok");
        label.textContent = peersN > 1 ? `已直连（${peersN} 台设备）` : "已直连（按键不走公网转发）";
        break;
      case "peer-error":
        dot.classList.remove("ok"); label.textContent = "协商出错：" + (ps.error || "未知"); break;
      case "reconnecting":
        dot.classList.remove("ok"); label.textContent = "信令断线，自动重连中…" + (ps.attempt ? `（第 ${ps.attempt} 次）` : ""); break;
      case "room-expired":
        dot.classList.remove("ok"); label.textContent = "房间已过期，请重新开启"; break;
      case "signal-failed":
        dot.classList.remove("ok"); label.textContent = "信令重连失败（" + (ps.error || "已达上限") + "）"; break;
      default:
        dot.classList.remove("ok"); label.textContent = "未开启";
    }
    const active = P2P_ACTIVE.includes(ps.phase);
    btn.textContent = active ? "关闭连接" : "开启连接";
    ovT.textContent = "P2P " + (ps.phase === "connected" ? "已直连" : (active ? "连接中" : "未开启"));
  }

  $("panelBtn").addEventListener("click", async () => {
    $("panelBtn").disabled = true;
    try {
      await window.touchdeck.consoleTogglePanel();
      await refresh();
    } catch (e) {
      toast("面板操作失败：" + e);
      $("panelBtn").disabled = false;
    }
  });
  $("p2pBtn").addEventListener("click", async () => {
    $("p2pBtn").disabled = true;
    try {
      const ps = await window.touchdeck.peerStatusGet();
      if (ps && P2P_ACTIVE.includes(ps.phase)) {
        await window.touchdeck.peerStop();
      } else {
        await window.touchdeck.peerStart();
      }
      await refresh();
    } catch (e) {
      toast("P2P 操作失败：" + e);
      $("p2pBtn").disabled = false;
    }
  });
  $("addrRoom").addEventListener("click", () => {
    copyText($("roomCode").textContent, $("addrRoom").querySelector(".copy-hint"));
  });
  window.touchdeck.onPeerStatus((ps) => renderP2P(ps));
  window.touchdeck.onPanelStatus((s) => renderPanel(s));
  window.touchdeck.onPeerPressFailed((id) => toast("远程按键注入失败：" + id));

  refresh();
  // 隐藏进托盘后暂停轮询，回前台立即补一次
  setInterval(() => { if (!document.hidden) refresh(); }, 4000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
